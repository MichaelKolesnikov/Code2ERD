# Every library and executable of the project is built into one folder:
# Windows looks for DLLs next to the executable
CODE2ERD_BIN_DIR = $$PWD/v/bin

DESTDIR = $$CODE2ERD_BIN_DIR
QMAKE_RPATHDIR += $$CODE2ERD_BIN_DIR

# Symbols are hidden by default as on Windows: a library exports only what is marked *_EXPORT
CONFIG += hide_symbols
# A shared library must resolve all its symbols at link time, as a Windows DLL does
linux: QMAKE_LFLAGS += -Wl,--no-undefined
